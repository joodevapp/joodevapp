<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balko – Balcony solar check</title>
<meta name="description" content="Balko measures where your balcony solar panel will go and estimates its yearly power and savings.">
<style>
  :root { --ink: #17181A; --muted: #5F6368; --accent: #F0B23C; --bg: #F6F5F2; --card: #FFFFFF; --line: #E6E3DC; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
  .hero { background: var(--ink); color: #fff; border-radius: 24px; padding: 32px 26px; }
  .hero h1 { margin: 0 0 6px; font-size: 40px; line-height: 1.1; }
  .hero p { margin: 0; color: #C9CACC; }
  .dot { color: var(--accent); }
  section { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 22px 24px; margin-top: 18px; }
  h2 { margin: 0 0 8px; font-size: 19px; }
  a { color: var(--ink); text-underline-offset: 3px; }
  ul { margin: 0; padding-left: 20px; }
  footer { margin-top: 28px; color: var(--muted); font-size: 14px; text-align: center; }
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>Balko<span class="dot">.</span></h1>
    <p>Balcony solar check. Hold your phone where the panel will go: Balko measures direction and tilt and estimates yearly power, savings and payback time.</p>
  </div>
  <section>
    <h2>Links</h2>
    <ul>
      <li><a href="Balko_privacy.html">Privacy policy</a></li>
      <li>Contact: <a href="mailto:joo.dev.app@gmail.com">joo.dev.app@gmail.com</a></li>
    </ul>
  </section>
  <footer>Solar data: PVGIS © European Union</footer>
</main>
</body>
</html>
